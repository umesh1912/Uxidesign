<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Valence Screens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a lab bench of phone frames on graph paper, one row that wraps; each frame is a real Valence screen. */
:root {
  --paper: #F5F7F2; --sheet: #FFFFFF; --ink: #16233F; --muted: #576178; --rule: #D9DFE8;
  --hl: #FFE45C; --hl-ink: #3D3300; --bench: #E9EDE6;
  --ph: #2F5BEA; --ch: #DB8400; --bi: #23955A; --ma: #C2307A; --cs: #0E8A9A;
  --ok: #1F8A4C; --bad: #C8372D;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0F1626; --sheet: #172036; --ink: #E7ECF6; --muted: #9BA6BD; --rule: #26314C;
  --hl: #E9CF3A; --hl-ink: #231D00; --bench: #0A101C; --ph: #7E9BFF; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0F1626; --sheet: #172036; --ink: #E7ECF6; --muted: #9BA6BD; --rule: #26314C;
  --hl: #E9CF3A; --hl-ink: #231D00; --bench: #0A101C; --ph: #7E9BFF; color-scheme: dark }

body { background: var(--bench); color: var(--ink); font-family: var(--body); font-size: 15px; }
.wrap { padding-block: 32px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1500px; margin: 0 auto; }
header { max-width: 62ch; margin-bottom: 28px; }
h1 { font-family: var(--display); font-size: 2.4rem; letter-spacing: -0.03em; margin: 0 0 6px; text-wrap: balance; }
header p { color: var(--muted); margin: 0; line-height: 1.55; }
.bench { display: flex; flex-wrap: wrap; gap: 28px; }
figure { margin: 0; display: flex; flex-direction: column; gap: 10px; }
figcaption { font-size: 0.85rem; color: var(--muted); }
figcaption b { color: var(--ink); }
.phone { width: 300px; max-width: 100%; height: 620px; border-radius: 34px; border: 8px solid var(--ink); background: var(--paper); overflow: hidden; position: relative; display: flex; flex-direction: column; }
.grid { background-image: linear-gradient(var(--rule) 0.6px, transparent 0.6px), linear-gradient(90deg, var(--rule) 0.6px, transparent 0.6px); background-size: 20px 20px; }
.scr { flex: 1; overflow: hidden; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.d { font-family: var(--display); letter-spacing: -0.02em; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.78rem; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
.btn { display: block; text-align: center; border-radius: 12px; padding: 13px; font-weight: 700; border: 1.4px solid var(--ink); }
.btn.fill { background: var(--ink); color: var(--paper); }
.mark { background: var(--hl); color: var(--hl-ink); padding: 4px 8px; border-radius: 3px 10px 3px 10px; font-weight: 700; display: inline-block; }
.nav { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--sheet); border-top: 1px solid var(--rule); padding: 8px 4px 10px; font-size: 0.65rem; text-align: center; color: var(--muted); }
.nav span::before { content: ""; display: block; width: 34px; height: 18px; margin: 0 auto 3px; border-radius: 9px; background: var(--rule); }
.nav .on { color: var(--ink); font-weight: 700; }
.nav .on::before { background: var(--hl); }
/* element tiles */
.tile { border: 1.6px solid var(--c); border-radius: 6px; background: color-mix(in srgb, var(--c) 10%, var(--sheet)); padding: 7px 8px; display: flex; flex-direction: column; aspect-ratio: 0.92; }
.tile .top { display: flex; justify-content: space-between; font-size: 0.68rem; font-weight: 700; }
.tile .top b { color: var(--c); }
.tile .sym { flex: 1; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 2.9rem; color: var(--c); line-height: 1; }
.tile .nm { font-weight: 700; font-size: 0.8rem; }
.bar { height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--c) 20%, transparent); margin-top: 5px; }
.bar i { display: block; height: 100%; border-radius: 2px; background: var(--c); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.strip { position: relative; height: 112px; }
.strip .t { position: absolute; width: 46px; height: 46px; border: 1.6px solid var(--c); border-radius: 6px; background: var(--sheet); font-family: var(--display); font-weight: 700; color: var(--c); display: grid; place-items: center; font-size: 1.3rem; }
.sq { width: 26px; height: 26px; border-radius: 5px; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 0.7rem; font-weight: 700; flex: none; }
.row { display: flex; align-items: center; gap: 10px; }
.readouts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.readouts .num { font-family: var(--display); font-size: 1.9rem; font-weight: 700; line-height: 1.1; }
.hlcard { background: var(--hl); border-color: var(--hl); color: var(--hl-ink); }
.check { width: 16px; height: 16px; border: 2px solid var(--ink); border-radius: 3px; flex: none; }
.check.done { background: var(--ink); }
.strike { text-decoration: line-through; color: var(--muted); }
.step { display: flex; gap: 8px; font-size: 0.85rem; line-height: 1.45; }
.step i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--ph); color: var(--ph); display: grid; place-items: center; font-size: 0.68rem; flex: none; }
.link { background: none; border: 0; padding: 4px 0; font: inherit; font-weight: 700; color: var(--ink); cursor: pointer; text-align: left; }
.link:focus-visible, .opt:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }
.opt { display: flex; gap: 10px; align-items: center; border: 1.4px solid var(--rule); background: var(--sheet); border-radius: 12px; padding: 11px; font: inherit; color: var(--ink); width: 100%; text-align: left; cursor: pointer; }
.opt b { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--rule); display: grid; place-items: center; font-size: 0.75rem; flex: none; }
.opt.sel { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.opt.sel b { background: var(--hl); color: var(--hl-ink); border-color: var(--hl); }
.pal { display: flex; gap: 6px; }
.pal span { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--rule); display: grid; place-items: center; font-size: 0.72rem; font-weight: 700; background: var(--sheet); }
.pal .a { background: var(--ink); color: var(--paper); }
.pal .r { background: #7B4FD6; color: #fff; }
.pal .cur { outline: 3px solid var(--hl); }
.timer { background: var(--hl); color: var(--hl-ink); border-radius: 99px; padding: 4px 10px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 0.85rem; }
.notes { display: grid; gap: 10px; }
.notes div { display: flex; gap: 10px; line-height: 1.5; font-size: 0.88rem; }
.notes b { color: var(--ph); }
@media (max-width: 420px) { .phone { width: 100%; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
<header>
  <h1>Valence</h1>
  <p>Preview of the science study app's design. A lab-notebook look: graph-paper backgrounds, subjects as periodic-table tiles, and one highlighter yellow for whatever matters most on each screen. The real app is in the Flutter project; this page shows how it looks.</p>
</header>

<div class="bench">

<figure>
<div class="phone"><div class="scr grid" style="justify-content:flex-end">
  <div class="strip" aria-hidden="true">
    <div class="t" style="--c:var(--ph);left:0;top:0">Ph</div>
    <div class="t" style="--c:var(--ch);left:54px;top:24px">Ch</div>
    <div class="t" style="--c:var(--bi);left:108px;top:0">Bi</div>
    <div class="t" style="--c:var(--ma);left:162px;top:24px">Ma</div>
    <div class="t" style="--c:var(--cs);left:216px;top:0">Cs</div>
  </div>
  <div style="flex:1"></div>
  <h2 class="d" style="font-size:2.3rem">Valence</h2>
  <p class="muted" style="margin:0;line-height:1.5">Lessons, solved examples, notes and mock tests for Physics, Chemistry, Biology, Maths and Computer Science.</p>
  <span class="btn fill">Continue with phone</span>
  <span class="btn">Continue with Google</span>
  <p class="small muted" style="text-align:center;margin:0">Use email instead</p>
</div></div>
<figcaption><b>Sign in</b> · phone OTP first, Google and email as options</figcaption>
</figure>

<figure>
<div class="phone"><div class="scr grid">
  <h2 class="d" style="font-size:1.45rem">Good evening, Riya</h2>
  <div class="readouts">
    <div class="card"><div class="num">167</div><div class="small muted">days to JEE</div></div>
    <div class="card hlcard"><div class="num">6</div><div class="small">day study streak</div></div>
  </div>
  <div class="row" style="justify-content:space-between"><h3 class="d" style="font-size:1.15rem">Today's plan</h3><span class="small"><b>Planner</b></span></div>
  <div class="card" style="display:grid;gap:12px">
    <div class="row"><span class="check done"></span><span class="sq" style="--c:var(--ph)">Ph</span><div><div class="strike small"><b>Laws of motion — notes</b></div><div class="small muted">6:30 am · 45 min</div></div></div>
    <div class="row"><span class="check"></span><span class="sq" style="--c:var(--ch)">Ch</span><div><div class="small"><b>VSEPR shapes — 15 questions</b></div><div class="small muted">5:00 pm · 40 min</div></div></div>
    <div class="row"><span class="check"></span><span class="sq" style="--c:var(--ma)">Ma</span><div><div class="small"><b>Chain rule — formula sheet</b></div><div class="small muted">8:30 pm · 30 min</div></div></div>
  </div>
  <h3 class="d" style="font-size:1.15rem">Pick up where you left off</h3>
  <div class="card row" style="border-color:var(--ph)"><span class="sq" style="--c:var(--ph);width:38px;height:38px">Ph</span><div><b>Newton's second law</b><div class="small muted">Physics · 20 min · 1 solved example</div></div></div>
</div>
<div class="nav"><span class="on">Today</span><span>Subjects</span><span>Practice</span><span>Library</span><span>You</span></div></div>
<figcaption><b>Today</b> · countdown, streak, plan, resume</figcaption>
</figure>

<figure>
<div class="phone"><div class="scr grid">
  <h2 class="d" style="font-size:1.45rem">Subjects</h2>
  <div class="card small muted">Search topics, e.g. "chain rule"</div>
  <div class="tiles">
    <div class="tile" style="--c:var(--ph)"><div class="top"><b>1</b><span class="muted">3 topics</span></div><div class="sym">Ph</div><div class="nm">Physics</div><div class="bar"><i style="width:33%"></i></div></div>
    <div class="tile" style="--c:var(--ch)"><div class="top"><b>2</b><span class="muted">2 topics</span></div><div class="sym">Ch</div><div class="nm">Chemistry</div><div class="bar"><i style="width:50%"></i></div></div>
    <div class="tile" style="--c:var(--bi)"><div class="top"><b>3</b><span class="muted">2 topics</span></div><div class="sym">Bi</div><div class="nm">Biology</div><div class="bar"><i style="width:50%"></i></div></div>
    <div class="tile" style="--c:var(--ma)"><div class="top"><b>4</b><span class="muted">1 topic</span></div><div class="sym">Ma</div><div class="nm">Maths</div><div class="bar"><i style="width:0"></i></div></div>
  </div>
</div>
<div class="nav"><span>Today</span><span class="on">Subjects</span><span>Practice</span><span>Library</span><span>You</span></div></div>
<figcaption><b>Subjects</b> · the periodic-table signature</figcaption>
</figure>

<figure>
<div class="phone"><div class="scr">
  <span class="small" style="color:var(--ph)"><b>Physics</b></span>
  <h2 class="d" style="font-size:1.7rem">Equations of motion</h2>
  <div class="notes">
    <div><b>1</b><span>When acceleration stays constant, three equations link u, v, a, t and s.</span></div>
    <div><b>2</b><span>Pick the equation with the three quantities you know and the one you want.</span></div>
  </div>
  <div><div class="small"><b>Key formula</b></div><span class="mark" style="margin-top:6px">v = u + at · v² = u² + 2as</span></div>
  <div class="card" style="display:grid;gap:8px">
    <span class="small" style="color:var(--ph)"><b>Example 1</b></span>
    <b style="font-size:0.88rem;line-height:1.4">A ball is thrown up at 20 m/s. How high does it rise? (g = 10 m/s²)</b>
    <div id="steps" style="display:grid;gap:6px"></div>
    <button class="link" id="next" type="button">Show first step</button>
  </div>
</div></div>
<figcaption><b>Lesson</b> · tap "Show first step" to try the reveal</figcaption>
</figure>

<figure>
<div class="phone"><div class="scr">
  <div class="row" style="justify-content:space-between"><b class="small">JEE Main — Mock 1</b><span class="timer">11:42</span></div>
  <div class="pal"><span class="a">1</span><span class="a">2</span><span class="r">3</span><span class="cur">4</span><span>5</span><span>6</span><span>7</span></div>
  <span class="small muted"><b>Question 4 of 8</b></span>
  <h3 class="d" style="font-size:1.2rem;line-height:1.3">A stone dropped from rest falls for 2 s (g = 10 m/s²). Distance fallen:</h3>
  <div style="display:grid;gap:8px" id="opts">
    <button class="opt" type="button"><b>A</b>10 m</button>
    <button class="opt sel" type="button"><b>B</b>20 m</button>
    <button class="opt" type="button"><b>C</b>40 m</button>
    <button class="opt" type="button"><b>D</b>5 m</button>
  </div>
  <p class="small muted" style="margin:0">+4 correct · −1 wrong. Tap an option to choose it.</p>
</div></div>
<figcaption><b>Mock test</b> · timer, question palette, review flags</figcaption>
</figure>

</div>
</div>

<script>
const steps = [
  'Take up as positive. u = 20 m/s, a = −10 m/s², and at the top v = 0.',
  'No time is given, so use v² = u² + 2as.',
  '0 = 400 − 20s, so s = 20 m.'
];
let shown = 0;
const box = document.getElementById('steps'), btn = document.getElementById('next');
btn.addEventListener('click', () => {
  if (shown < steps.length) {
    const d = document.createElement('div'); d.className = 'step';
    d.innerHTML = '<i>' + (shown + 1) + '</i><span></span>';
    d.querySelector('span').textContent = steps[shown];
    box.appendChild(d); shown++;
    if (shown === steps.length) {
      const a = document.createElement('span'); a.className = 'mark'; a.textContent = 'Answer: 20 m';
      box.appendChild(a); btn.textContent = 'Hide steps';
    } else btn.textContent = 'Show next step';
  } else { box.innerHTML = ''; shown = 0; btn.textContent = 'Show first step'; }
});
document.querySelectorAll('#opts .opt').forEach(o => o.addEventListener('click', () => {
  document.querySelectorAll('#opts .opt').forEach(x => x.classList.remove('sel'));
  o.classList.add('sel');
}));
</script>

</body></html>
